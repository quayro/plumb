name: Verify

on:
  pull_request:
  push:
    branches: [main] # a pull request branch is checked by its pull_request run
  workflow_dispatch: # rerun on demand, as after enabling actions

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the commit and policy checks compare against the base, so they need history and the real head commit
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0 # the oldest node plumb supports, which runs its typescript without a build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Verify the workspace uses the pinned Bun
        run: test "bun@$(bun --version)" = "$(jq -r .packageManager package.json)"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # plumb checks its own python and rust sources with the versions plumb.json pins
      - name: Install ruff, mypy and the Rust toolchain
        run: |
          pipx install ruff==0.17.4
          pipx install mypy==2.4.1
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      # check --base is the full check plus the policy ratchet, so one run covers both
      - name: Check conventions, formatting, types, docs and dead code, and refuse policy that weakens the base
        env:
          # a change is judged by the adapter it was based on: the pull request's base, or main before a push
          PLUMB_ADAPTER_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD' }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          node scripts/plumb.ts check ${base:+--base "$base"}
      - name: Check every commit in the pull request
        if: github.event_name == 'pull_request'
        run: node bin/plumb.ts commits --range "origin/${{ github.base_ref }}..HEAD"
      - name: Check the pull request title, which becomes the squash subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node bin/plumb.ts commits --message "$PR_TITLE"
      - name: Check every commit pushed to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node bin/plumb.ts commits --range "$BEFORE..$AFTER"
      - name: Run the core, JavaScript and Python suites
        run: node scripts/test.ts
      - name: Verify autofix convergence
        env:
          PLUMB_ADAPTER_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD' }}
        run: |
          node scripts/plumb.ts fix
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Install ruff, mypy, the Rust toolchain and the sandbox tool
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          pipx install ruff==0.17.4
          pipx install mypy==2.4.1
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          # bubblewrap confines an adapter in its own user namespace, which the runner image restricts
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the native suite
        run: node scripts/test.ts native
  # verify proves the oldest supported runtime on Linux; this job proves the same suites on the
  # other supported environments, without changing the name of the required check
  environments:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.18.0, 24]
        exclude:
          - os: ubuntu-latest
            node: 22.18.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run the core, JavaScript, Python and adapter suites
        run: node scripts/test.ts
